# GXC-CORE testnet configuration
#
#   gxc-node --testnet --config config/gxc-testnet.conf
#
# Testnet exists to be easy to run. Its proof-of-work limit is near-maximal
# (compact 0x207fffff), so a single CPU finds blocks immediately at difficulty
# 1.0 -- unlike mainnet, whose limit is Bitcoin's difficulty-1 target.
#
# Keys match src/Config.cpp exactly; an unrecognized key is silently ignored.

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------

testnet=true

network_port=19333
rpc_port=18332
rest_port=18080

max_connections=100
max_peers=20
min_peers=2
connection_timeout=30

# Testnet peers misbehave while people experiment; be slower to ban.
ban_threshold=50
ban_duration=3600

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------

data_dir=./gxc_testnet_data
wallet_file=testnet_wallet.dat
wallet_backup_interval=3600

cache_size=134217728
vacuum_interval=604800
checkpoint_interval=1000

# ---------------------------------------------------------------------------
# Consensus
# ---------------------------------------------------------------------------

# Two-minute blocks, so a chain of useful length builds in minutes.
target_block_time=120
difficulty_adjustment_interval=10
block_reward=50.0
max_block_size=1048576

# Shorter confirmation depth for faster iteration.
min_confirmations=1

# ---------------------------------------------------------------------------
# Proof of Traceability
# ---------------------------------------------------------------------------

# Kept strict on testnet as well. Testing against relaxed rules tells you
# nothing about whether a transaction would be accepted on mainnet.
enable_traceability=true
traceability_validation=strict
trace_depth_limit=10000

# ---------------------------------------------------------------------------
# Mining
# ---------------------------------------------------------------------------

enable_mining=true

# SHA256 is the cheapest of the three to run on a laptop. GXHash is Argon2id
# at 64 MiB per attempt and is deliberately slow.
mining_algorithm=SHA256
mining_threads=1

# Set this to a tGXC address before enabling mining.
miner_address=

pool_address=

# ---------------------------------------------------------------------------
# Fees
# ---------------------------------------------------------------------------

transaction_fee=0.001
base_transaction_fee=0.001
min_tx_fee=0.0001
max_transaction_fee=0.01
mempool_size=50000000

enable_dynamic_fees=false
fee_low_threshold=10
fee_low_multiplier=1.0
fee_medium_threshold=50
fee_medium_multiplier=1.5
fee_high_threshold=100
fee_high_multiplier=2.0
fee_very_high_multiplier=3.0

# ---------------------------------------------------------------------------
# APIs
# ---------------------------------------------------------------------------

enable_rpc_api=true
enable_rest_api=true
api_rate_limit=1000

# No API key on testnet. Bind to localhost and keep it off public interfaces.
api_key=

enable_ssl=false
ssl_cert_file=
ssl_key_file=

# ---------------------------------------------------------------------------
# Governance
# ---------------------------------------------------------------------------

governance_enabled=true
proposal_deposit=10.0
quorum_threshold=0.10

# One hour, so a governance cycle can be exercised in a single session.
voting_period=3600

# ---------------------------------------------------------------------------
# Cross-chain bridge
# ---------------------------------------------------------------------------

bridge_enabled=false
bridge_validators=3
bridge_threshold=2

# ---------------------------------------------------------------------------
# Logging and diagnostics
# ---------------------------------------------------------------------------

log_level=DEBUG
log_file=gxc_testnet.log
log_to_console=true
log_max_size=10485760
log_max_files=5

debug_mode=true
enable_profiling=false
stats_interval=60
